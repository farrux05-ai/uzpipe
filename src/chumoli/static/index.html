    </div>`;

  foot.innerHTML=`<button class="btn btn-ghost" id="back4">← Orqaga</button><button class="btn btn-primary" id="save2">${editingName?'Yangilash':'Saqlash'}</button>`;
  document.getElementById('back4').onclick=()=>{ step=3; renderDrawer(); };
  document.getElementById('save2').onclick=savePipeline;

  document.getElementById('goto-tg')?.addEventListener('click',e=>{
    e.preventDefault(); closeDrawer(); page='settings';
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page==='settings'));
    document.getElementById('top-title').textContent=PAGE_TITLES.settings; render();
  });

  const destSel=document.getElementById('f-dest');
  const destMode=document.getElementById('f-dest-mode');
  // Per-destination connection cache — never share PG/CH/filesystem URLs across keys
  if(!draft._destConnByKey) draft._destConnByKey={};
  let _lastDestKey=destSel?.value||'duckdb';
  const syncDest=()=>{
    const key=destSel?.value||'duckdb';
    const d=destinations.find(x=>x.key===key);
    const wrap=document.getElementById('dest-conn-wrap');
    const fmtWrap=document.getElementById('dest-format-wrap');
    const connEl=document.getElementById('f-dest-conn');
    const isFs=key==='filesystem'||key==='s3';
    // Persist previous destination's connection before switching
    if(connEl && _lastDestKey && _lastDestKey!==key){
      draft._destConnByKey[_lastDestKey]=connEl.value||'';
    }
    _lastDestKey=key;
    draft['f-dest']=key;
    // Drop shared fallback so old PG string cannot leak into ClickHouse/others
    delete draft['f-dest-conn'];
    if(fmtWrap) fmtWrap.style.display=isFs?'block':'none';
    const pickBtn=document.getElementById('btn-pick-folder');
    if(d?.needs_connection || key==='filesystem' || key==='s3'){
      wrap.style.display='block';
      document.getElementById('dest-conn-label').textContent=d?.connection_label||'Connection';
      if(connEl){
        connEl.placeholder=d?.connection_placeholder||'';
        // text for path/URL, password for DB secrets
        connEl.type=(key==='filesystem'||key==='s3')?'text':'password';
        const cached=draft._destConnByKey[key];
        connEl.value=(cached!==undefined && cached!==null)?cached:'';
        draft._destConnByKey[key]=connEl.value;
      }
      document.getElementById('dest-conn-help').textContent=d?.connection_help||'';
      if(pickBtn) pickBtn.style.display=key==='filesystem'?'inline-flex':'none';
    }else{
      wrap.style.display='none';
      if(connEl) connEl.value='';
      if(pickBtn) pickBtn.style.display='none';
    }
  };
  const syncDestMode=()=>{
    const saved=destMode?.value==='saved';
    const sw=document.getElementById('dest-saved-wrap');
    const nw=document.getElementById('dest-new-wrap');
    if(sw) sw.style.display=saved?'block':'none';
    if(nw) nw.style.display=saved?'none':'block';
  };
  if(destSel){
    destSel.onchange=()=>{ syncDest(); };
    const connEl=document.getElementById('f-dest-conn');
    if(connEl){
      connEl.addEventListener('input',()=>{
        const k=destSel.value||'duckdb';
        draft._destConnByKey[k]=connEl.value||'';
      });
    }
    const pickBtn=document.getElementById('btn-pick-folder');
    if(pickBtn){
      pickBtn.onclick=async()=>{
        pickBtn.disabled=true;
        const prev=pickBtn.textContent;
        pickBtn.textContent='…';
        try{
          const res=await api('/api/ui/pick-folder',{method:'POST',body:'{}'});
          if(res.cancelled){ toast('Bekor qilindi','ok'); return; }
          if(res.path){
            const el=document.getElementById('f-dest-conn');
            if(el){
              el.value=res.path;
              draft._destConnByKey['filesystem']=res.path;
            }
            toast('Papka tanlandi','ok');
          }
        }catch(e){ toast(e.message||String(e),'err'); }
        finally{ pickBtn.disabled=false; pickBtn.textContent=prev; }
      };
    }
    syncDest();
  }
  if(destMode){ destMode.onchange=syncDestMode; syncDestMode(); }

  const sk=document.getElementById('f-sched-kind');
  const syncSched=()=>{ const k=sk?.value||'manual'; document.getElementById('sched-interval-wrap').style.display=k==='interval'?'block':'none'; const dw=document.getElementById('sched-daily-wrap'); if(dw) dw.style.display=k==='daily_at'?'block':'none'; };
  if(sk){ sk.onchange=syncSched; syncSched(); }

  const wd=document.getElementById('f-wd');
  const syncWd=()=>{ const w=document.getElementById('pk-wrap'); if(w) w.style.display=wd?.value==='merge'?'block':'none'; };
  if(wd && !document.getElementById('table-write-list')){ wd.onchange=syncWd; syncWd(); }

  function syncDupHint(){
    const wdEl = document.getElementById('f-wd');
    const dup = document.getElementById('f-q-dup');
    const hint = document.getElementById('dup-hint');
    if(!wdEl || !dup || !hint) return;
    hint.style.display = (wdEl.value==='append' && dup.value.trim()) ? 'block' : 'none';
  }
  document.getElementById('f-wd')?.addEventListener('change', syncDupHint);
  document.getElementById('f-q-dup')?.addEventListener('input', syncDupHint);
  syncDupHint();

  function collectTableWrite(){
    const list=document.getElementById('table-write-list');
    if(!list) return null;
    const out={};
    list.querySelectorAll('[data-tw-table]').forEach(row=>{
      const t=row.getAttribute('data-tw-table');
      const mode=(row.querySelector('.tw-mode')||{}).value||'replace';
      let pk='';
      if(mode==='merge'){
        const man=(row.querySelector('.tw-pk-manual')||{}).value||'';
        const sel=(row.querySelector('.tw-pk')||{}).value||'';
        pk=(man||sel||'id').trim();
      }
      out[t]={mode, pk};
    });
    const hidden=document.getElementById('f-table_write');
    if(hidden) hidden.value=JSON.stringify(out);
    draft['f-table_write']=JSON.stringify(out);
    // Global fallback = first table mode
    const first=Object.values(out)[0];
    if(first){
      draft['f-wd']=first.mode;
      const hwd=document.getElementById('f-wd'); if(hwd) hwd.value=first.mode;
      if(first.mode==='merge'){
        draft['f-pk']=first.pk||'id';
        const hpk=document.getElementById('f-pk'); if(hpk) hpk.value=first.pk||'id';
      }
    }
    return out;
  }
  document.querySelectorAll('.tw-mode').forEach(el=>{
    el.addEventListener('change',()=>{
      const row=el.closest('[data-tw-table]');
      const wrap=row&&row.querySelector('.tw-pk-wrap');
      if(wrap) wrap.style.display=el.value==='merge'?'block':'none';
      collectTableWrite();
    });
  });
  document.querySelectorAll('.tw-pk, .tw-pk-manual').forEach(el=>{
    el.addEventListener('change', collectTableWrite);
    el.addEventListener('input', collectTableWrite);
  });
  if(document.getElementById('table-write-list')) collectTableWrite();
}

function fieldHtml(f){
  const req=f.required?' *':'';
  // Prefer explicit draft value (including empty string); only fall back to default when unset
  const savedVal=(draft['f-'+f.key]!==undefined&&draft['f-'+f.key]!==null)
    ? draft['f-'+f.key]
    : (f.default??'');
  if(f.type==='select'){
    return `<div class="field"><label>${esc(f.label)}${req}</label>
      <select id="f-${esc(f.key)}">${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${savedVal===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>
      ${f.help_text?`<div class="field-hint">${esc(f.help_text)}</div>`:''}</div>`;
  }
  const type=f.type==='password'?'password':(f.type==='number'?'number':'text');
  let ph=f.placeholder||'';
  if(f.type==='password'){
    if(editingName&&!draft['f-'+f.key]) ph="Bo'sh qoldiring — o'zgarmaydi";
    else if(draft['f-'+f.key]) ph="•••••••• (kiritilgan, o'zgartirish uchun yozing)";
  }
  return `<div class="field"><label>${esc(f.label)}${req}</label>
    <input id="f-${esc(f.key)}" type="${type}" placeholder="${esc(ph)}" value="${esc(f.type==='password'?'':savedVal)}"/>
    ${f.help_text?`<div class="field-hint">${esc(f.help_text)}</div>`:''}</div>`;
}

async function runSqlInspect(){
  const el=document.getElementById('f-connection_string');
  // Password field is cleared on re-render — prefer live value, else draft
  const live=(el&&el.value)?el.value.trim():'';
  const conn=live||(draft['f-connection_string']||'').trim();
  if(!conn){ toast('Connection string kiriting','err'); testState='fail'; return; }
  if(live) draft['f-connection_string']=live;
  const btn=document.getElementById('btn-inspect');
  if(btn){ btn.disabled=true; btn.textContent='Tekshirilmoqda…'; }
  const prevState=testState;
  testState='idle';
  try{
    const res=await api('/api/connectors/sql_database/inspect',{method:'POST',body:JSON.stringify({connection_string:conn})});
    inspectedTables=res.tables||[];
    inspectedDbLabel=res.database||'';
    inspectedColumns=res.columns||{};
    testState='ok';
    // Keep connection in draft so Back/Next never loses it
    draft['f-connection_string']=conn;
    const dbLabel=inspectedDbLabel?` (${inspectedDbLabel})`:'';
    toast(inspectedTables.length
      ? (inspectedTables.length+' jadval topildi'+dbLabel)
      : ("Ulanish OK — jadval yo'q"+dbLabel));
    renderDrawer();
  }catch(e){
    testState='fail'; inspectedTables=[]; inspectedDbLabel=""; inspectedColumns={}; toast(e.message,'err');
    if(btn){ btn.disabled=false; btn.textContent='Ulanishni tekshirish'; }
    renderDrawer();
  }
}

async function savePipeline(){
  captureDraft();
  const m=connectors.find(x=>x.key===selectedConnector);
  const name=(editingName||dv('f-name','')||(document.getElementById('f-name')||{}).value||'').toString().trim();
  if(!name){ toast('Nom majburiy','err'); return; }
  const source_params={},secrets={};
  for(const f of(m?.fields||[])){
    const el=document.getElementById('f-'+f.key);
    let v=el?el.value:'';
    if(draft['f-'+f.key]!==undefined&&draft['f-'+f.key]!==null&&draft['f-'+f.key]!==''){
      if(!el||el.type==='password'||!el.value) v=draft['f-'+f.key];
    }
    if((f.key==='table_names'||f.key==='table_cursors')&&draft['f-'+f.key]){
      v=draft['f-'+f.key];
    }
    if(f.secret) secrets[f.key]=v; else source_params[f.key]=v;
  }
  // SQL: table_names / table_cursors / table_write live in draft
  if(isSqlConnector(selectedConnector)){
    if(typeof collectTableWrite==='function') collectTableWrite();
    if(draft['f-table_names']) source_params.table_names=draft['f-table_names'];
    if(draft['f-table_cursors']) source_params.table_cursors=draft['f-table_cursors'];
    if(draft['f-table_write']) source_params.table_write=draft['f-table_write'];
    if(!source_params.table_names||!String(source_params.table_names).trim()){
      toast('Kamida bitta jadval tanlang','err'); return;
    }
    // Validate merge rows have a key
    try{
      const tw=JSON.parse(source_params.table_write||'{}')||{};
      for(const [tn,cfg] of Object.entries(tw)){
        if(cfg.mode==='merge'&&!(cfg.pk||'').trim()){
          toast(tn+': Yangilash uchun kalit ustun tanlang (masalan id)','err'); return;
        }
      }
    }catch(e){}
  }
  const destMode=(document.getElementById('f-dest-mode')||{}).value||'new';
  let dest={connector:'duckdb',dataset_name:'raw'};
  let saved_destination_id=null;
  if(destMode==='saved'){
    const sid=(document.getElementById('f-saved-dest')||{}).value;
    if(!sid){ toast('Saqlangan joy tanlang','err'); return; }
    saved_destination_id=sid;
  }else{
    const destKey=document.getElementById('f-dest')?.value||'duckdb';
    const destConnEl=document.getElementById('f-dest-conn');
    dest={connector:destKey,dataset_name:(document.getElementById('f-dataset')||{}).value||'raw'};
    // Only connection for the selected dest key (never another destination's URL)
    let connVal='';
    if(destConnEl && (destConnEl.offsetParent!==null || destKey==='filesystem' || destKey==='s3')){
      connVal=(destConnEl.value||'').trim();
    }
    if(!connVal && draft._destConnByKey && Object.prototype.hasOwnProperty.call(draft._destConnByKey, destKey)){
      connVal=String(draft._destConnByKey[destKey]||'').trim();
    }
    // Empty filesystem path → backend default ~/chumoli-data/exports/<pipeline>/
    if(connVal) dest.connection=connVal;
    if(destKey==='filesystem'||destKey==='s3'){
      const ff=(document.getElementById('f-file-format')||{}).value||'csv';
      dest.file_format=ff;
    }
  }
  let pkRaw=((document.getElementById('f-pk')||{}).value||draft['f-pk']||'').trim();
  let wdVal=(document.getElementById('f-wd')||{}).value||draft['f-wd']||'replace';
  // If per-table write has any merge, ensure global pk for validation
  try{
    const tw=JSON.parse(draft['f-table_write']||'{}')||{};
    const modes=Object.values(tw);
    if(modes.some(c=>c.mode==='merge')){
      wdVal='merge';
      const firstMerge=modes.find(c=>c.mode==='merge');
      if(firstMerge&&firstMerge.pk) pkRaw=firstMerge.pk;
    } else if(modes.length){
      wdVal=modes[0].mode||wdVal;
    }
  }catch(e){}
  const primary_key=pkRaw?pkRaw.split(',').map(s=>s.trim()).filter(Boolean):[];
  const schedKind=(document.getElementById('f-sched-kind')||{}).value||'manual';
  const schedMin=parseInt((document.getElementById('f-sched-min')||{}).value||'60',10);
  if(schedKind==='interval' && (isNaN(schedMin) || schedMin<5)){
    toast("Interval kamida 5 daqiqa bo'lishi kerak",'err');
    return;
  }
  const schedTime=((document.getElementById('f-sched-time')||{}).value||'10:00').trim();
  const schedule={
    kind:schedKind,
    interval_minutes:schedKind==='interval'&&!isNaN(schedMin)?schedMin:null,
    daily_at_time:schedKind==='daily_at'?schedTime:null,
    timezone:'Asia/Tashkent'
  };
  const qMin=(document.getElementById('f-q-min')||{}).value||'';
  const qNn=((document.getElementById('f-q-nn')||{}).value||'').trim();
  const qDup=((document.getElementById('f-q-dup')||{}).value||'').trim();
  const qTable=((document.getElementById('f-q-table')||{}).value||'').trim();
  const quality={row_count_min:qMin!==''?parseInt(qMin,10):null,not_null_columns:qNn?qNn.split(',').map(s=>s.trim()).filter(Boolean):[],no_duplicates_key:qDup||null,table_name:qTable||null};
  const tgChat=((document.getElementById('f-tg-chat')||{}).value||'').trim();
  const notify={on_failure:(document.getElementById('f-n-fail')||{}).checked!==false,on_success:!!(document.getElementById('f-n-ok')||{}).checked,telegram_chat_id:tgChat||null};
  const body={name,connector_key:selectedConnector,source_params,secrets,destination:dest,write_disposition:wdVal||'replace',primary_key,schedule,quality,notify};
  if(saved_destination_id) body.saved_destination_id=saved_destination_id;
  try{
    await api('/api/pipelines',{method:'POST',body:JSON.stringify(body)});
    toast('Saqlandi: '+name); closeDrawer();
    pipelines=await api('/api/pipelines'); runs=await api('/api/runs?limit=50').catch(()=>runs);
    page='pipelines';
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page==='pipelines'));
    document.getElementById('top-title').textContent=PAGE_TITLES.pipelines;
    renderPipelines();
  }catch(e){ toast(e.message,'err'); }
}

/* ── RECOVERY ─────────────────────────────────────────── */
async function openRecover(name){
  recoverPipeline=name;
  document.getElementById('drawer-title').textContent='Tiklash: '+name;
  const body=document.getElementById('drawer-body');
  const foot=document.getElementById('drawer-foot');
  body.innerHTML=`<div style="color:var(--faint);padding:12px 0">Yuklanmoqda…</div>`;
  foot.innerHTML=`<button class="btn btn-ghost" id="rc">Yopish</button>`;
  document.getElementById('rc').onclick=()=>{ recoverPipeline=null; closeDrawer(); };
  openDrawer();
  let jobs=[];
  try{ jobs=await api('/api/pipelines/'+encodeURIComponent(name)+'/failed-jobs'); }
  catch(e){ toast('Failed jobs: '+e.message,'err'); }

  const noJobs=!jobs||jobs.length===0||(jobs.length===1&&(!jobs[0].detail||/none/i.test(jobs[0].detail)));
  body.innerHTML=`
    <div class="section-title">Muammo tafsiloti</div>
    ${noJobs?`<p style="color:var(--faint);font-size:13px;margin-bottom:16px">Muvaffaqiyatsiz job topilmadi — qayta ishga tushiring</p>`:
    `<ul class="recover-list">${jobs.map(j=>`<li>${esc(j.detail||j.job||JSON.stringify(j))}</li>`).join('')}</ul>`}

    <div class="section-title" style="margin-top:4px">Tiklash vositalari</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-outline" id="rc-sync" style="justify-content:flex-start;text-align:left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Destination bilan sinxronlashtirish
      </button>
      <button class="btn btn-outline" id="rc-drop-pending" style="justify-content:flex-start;text-align:left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Kutayotgan paketlarni tozalash
      </button>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <input id="rc-resource" placeholder="jadval nomi, masalan items" style="flex:1;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);outline:none"/>
        <button class="btn btn-danger" id="rc-drop-res" disabled>Jadvalni reset</button>
      </div>
      <div class="field-hint">Faqat shu jadval holatini qayta o'rnatadi</div>
    </div>`;
  foot.innerHTML=`<button class="btn btn-ghost" id="rc2">Yopish</button>`;
  document.getElementById('rc2').onclick=()=>{ recoverPipeline=null; closeDrawer(); };

  const resInput=document.getElementById('rc-resource');
  const dropBtn=document.getElementById('rc-drop-res');
  resInput.oninput=()=>{ dropBtn.disabled=!resInput.value.trim(); };
  document.getElementById('rc-sync').onclick=()=>doRecover('sync',null);
  document.getElementById('rc-drop-pending').onclick=()=>doRecover('drop-pending',null);
  dropBtn.onclick=()=>{ const r=resInput.value.trim(); if(!r) return; doRecover('drop-resource',r); };
}

async function doRecover(action,resource){
  if(!recoverPipeline) return;
  const labels={'sync':'Destinationdan sinxronlashtirilsinmi?','drop-pending':'Pending paketlar tozalansinmi?','drop-resource':'Jadval "'+resource+'" qayta o\'rnatilsinmi?'};
  if(!confirm(labels[action]||'Davom etilsinmi?')) return;
  let path='/api/pipelines/'+encodeURIComponent(recoverPipeline)+'/recover/'+action;
  if(action==='drop-resource'&&resource) path+='?resource='+encodeURIComponent(resource);
  const btns=['rc-sync','rc-drop-pending','rc-drop-res'].map(id=>document.getElementById(id)).filter(Boolean);
  btns.forEach(b=>b.disabled=true);
  try{
    const r=await api(path,{method:'POST'});
    const ok=r?.status!=='error';
    toast((r?.detail||r?.status||'Bajarildi'), ok?'ok':'err');
  }catch(e){ toast(e.message,'err'); }
  finally{
    btns.forEach(b=>b.disabled=false);
    const resInput=document.getElementById('rc-resource');
    const dropBtn=document.getElementById('rc-drop-res');
    if(dropBtn&&resInput) dropBtn.disabled=!resInput.value.trim();
  }
}

loadAll();
