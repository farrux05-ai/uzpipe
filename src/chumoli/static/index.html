<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Chumoli — Uzbekistan data sources uchun lightweight EL tool"/>
<title>Chumoli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d97706'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M 44 32 Q 36 20 28 22'/%3E%3Cpath d='M 56 32 Q 64 20 72 22'/%3E%3Cpath d='M 44 48 Q 28 42 22 52'/%3E%3Cpath d='M 56 48 Q 72 42 78 52'/%3E%3Cpath d='M 44 54 Q 26 56 20 68'/%3E%3Cpath d='M 56 54 Q 74 56 80 68'/%3E%3Cpath d='M 44 60 Q 30 72 26 82'/%3E%3Cpath d='M 56 60 Q 70 72 74 82'/%3E%3C/g%3E%3Cg fill='%23ffffff'%3E%3Ccircle cx='50' cy='34' r='8'/%3E%3Cellipse cx='50' cy='52' rx='6' ry='9'/%3E%3Cellipse cx='50' cy='73' rx='11' ry='14'/%3E%3C/g%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f4;--bg-warm:#f4f0e8;--surface:#fff;--surface-2:#fdf9f3;
  --hover:#ede8de;--border:#e8e0d0;--border-s:#d8cdb8;
  --text:#1c1917;--dim:#57534e;--faint:#a8a29e;
  --accent:#d97706;--accent-hover:#b45309;--accent-soft:rgba(217,119,6,.1);--accent-text:#b45309;
  --green:#059669;--green-bg:rgba(5,150,105,.1);
  --red:#dc2626;--red-bg:rgba(220,38,38,.09);
  --amber:#d97706;--violet:#7c3aed;
  --shadow:0 1px 3px rgba(28,25,23,.04),0 4px 12px rgba(28,25,23,.03);
  --shadow-lg:0 8px 28px rgba(28,25,23,.08);
  --radius:10px;--radius-sm:8px;
  --ring:0 0 0 3px rgba(217,119,6,.18);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:224px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg-warm);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:52px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 20px;gap:12px;position:relative;z-index:10}
#content{flex:1;overflow-y:auto;padding:28px}
#content::-webkit-scrollbar{width:8px}
#content::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:8px;border:2px solid var(--bg)}

/* Sidebar */
.logo{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;letter-spacing:-.01em}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#f59e0b,#d97706,#b45309);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 8px rgba(217,119,6,.3);flex-shrink:0}
.nav-section{padding:10px 8px;flex:1}
.nav-label{padding:10px 10px 5px;font-size:10.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--dim);font-weight:500;transition:background .1s,color .1s;margin-bottom:1px;position:relative}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.65;transition:opacity .1s}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item:hover svg{opacity:1}
.nav-item.active{background:var(--surface);color:var(--accent-text);font-weight:600;box-shadow:var(--shadow)}
.nav-item.active svg{opacity:1;color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
.side-foot{padding:12px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
.side-foot-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.side-foot-dot.off{background:var(--faint)}

/* Topbar */
.top-title{font-weight:600;font-size:14px}
.status-pill{margin-left:auto;display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--border);border-radius:999px;font-size:11.5px;font-weight:500;color:var(--dim);background:var(--surface-2)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.status-pill.off .status-dot{background:var(--faint)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(5,150,105,.35)}70%{box-shadow:0 0 0 6px rgba(5,150,105,0)}100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}
.status-pill:not(.off) .status-dot{animation:pulse 2.2s infinite}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;font-weight:500;transition:all .12s;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(217,119,6,.2)}.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{border:1px solid var(--border-s);background:var(--surface)}.btn-outline:hover{background:var(--hover)}
.btn-ghost{color:var(--dim)}.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.45;pointer-events:none}

/* Page header */
.page-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.02em}
.page-sub{color:var(--faint);margin-top:3px;font-size:13px}

/* Table */
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{padding:10px 16px;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .08s}
tbody tr:hover{background:var(--surface-2)}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge.ok{color:var(--green);background:var(--green-bg)}
.badge.err{color:var(--red);background:var(--red-bg)}
.badge.warn{color:var(--amber);background:rgba(217,119,6,.12)}
.badge.dim{color:var(--faint);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.run-metrics{font-size:12px;color:var(--dim);margin-left:6px}
.metric-new{color:var(--green);font-weight:500}
.metric-dim{color:var(--faint)}
.metric-speed{color:var(--accent-text)}
.metric-time{color:var(--faint)}
.metric-ram{color:var(--violet);font-size:11.5px}

/* Ulagich pill in table */
.conn-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:500;white-space:nowrap}
.conn-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:14px 16px;cursor:pointer;transition:all .13s;text-align:left;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--accent-text)}
.card-icon svg{display:block}
.card-conn:hover .card-icon{background:var(--accent-soft);border-color:rgba(217,119,6,.35)}
.card-conn .card-meta{color:var(--accent-text);font-weight:500}
.conn-section{margin-bottom:28px}
.conn-section-hd{margin-bottom:12px}
.conn-section-hint{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.4}
.card-title{font-weight:600;margin-bottom:3px;font-size:13.5px}
.card-desc{color:var(--faint);font-size:12px;line-height:1.45}
.card-meta{margin-top:8px;font-size:11.5px;color:var(--faint)}

/* Empty state */
.empty-state{text-align:center;padding:56px 24px 48px;border:1.5px dashed var(--border-s);border-radius:var(--radius);background:var(--surface-2)}
.empty-icon{font-size:40px;margin-bottom:14px;line-height:1}
.empty-title{font-size:16px;font-weight:600;color:var(--dim);margin-bottom:8px}
.empty-desc{color:var(--faint);max-width:400px;margin:0 auto 20px;line-height:1.55;font-size:13px}
.empty-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* Quick action cards on empty */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:24px;max-width:640px;margin-left:auto;margin-right:auto;text-align:left}
.quick-card{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:14px;cursor:pointer;transition:all .12s;box-shadow:var(--shadow)}
.quick-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg)}
.quick-card-icon{font-size:20px;margin-bottom:8px}
.quick-card-title{font-weight:600;font-size:12.5px;margin-bottom:3px}
.quick-card-desc{font-size:11.5px;color:var(--faint);line-height:1.4}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:14px 16px;box-shadow:var(--shadow)}
.stat-val{font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat-lbl{font-size:11.5px;color:var(--faint);margin-top:3px}

/* Sparkline row */
.spark-row{display:flex;align-items:center;gap:3px;height:24px}
.spark-bar{width:5px;border-radius:2px;min-height:3px;transition:height .2s}

/* Overlay + Drawer */
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.25);backdrop-filter:blur(2px);z-index:40;display:none;opacity:0;transition:opacity .18s}
.overlay.show{display:block;opacity:1}
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);z-index:50;transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(28,25,23,.06)}
.drawer.open{transform:translateX(0)}
.drawer-head{height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;flex-shrink:0}
.dsteps{display:flex;gap:4px}
.dstep{width:20px;height:3px;border-radius:3px;background:var(--border);transition:background .18s}
.dstep.on{background:var(--accent)}
.drawer-close{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--faint);transition:all .1s}
.drawer-close:hover{background:var(--hover);color:var(--text)}
.drawer-body{flex:1;overflow-y:auto;padding:18px}
.drawer-body::-webkit-scrollbar{width:6px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.drawer-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2);flex-shrink:0}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:5px}
.field input:not([type=checkbox]):not([type=radio]),
.field select,
.field textarea{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 12px;background:var(--surface);outline:none;transition:border .12s,box-shadow .12s;color:var(--text)}
.field textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.field input:not([type=checkbox]):not([type=radio]):focus,
.field select:focus,
.field textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
.field input:not([type=checkbox]):not([type=radio])::placeholder,
.field textarea::placeholder{color:var(--faint)}
.field-hint{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.5}
.field-ok{font-size:11.5px;color:var(--green);margin-top:5px}
.field-err{font-size:11.5px;color:var(--red);margin-top:5px}

/* SQL table picker */
.sql-picker{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}
.sql-picker-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.sql-picker-bar .sql-count{font-size:11.5px;color:var(--dim);font-weight:500}
.sql-picker-bar .sql-actions{display:flex;gap:4px}
.sql-picker-bar .sql-link{font-size:11.5px;font-weight:500;color:var(--accent-text);padding:3px 8px;border-radius:6px}
.sql-picker-bar .sql-link:hover{background:var(--accent-soft)}
.sql-picker-list{max-height:220px;overflow-y:auto;padding:6px}
.sql-picker-list::-webkit-scrollbar{width:6px}
.sql-picker-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.sql-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;user-select:none;transition:background .1s}
.sql-row:hover{background:var(--hover)}
.sql-row.is-on{background:var(--accent-soft)}
.sql-row input[type=checkbox]{
  appearance:none;-webkit-appearance:none;
  width:16px;height:16px;flex-shrink:0;margin:0;
  border:1.5px solid var(--border-s);border-radius:4px;
  background:var(--surface);cursor:pointer;position:relative;
  transition:border-color .12s,background .12s;
}
.sql-row input[type=checkbox]:checked{
  background:var(--accent);border-color:var(--accent);
}
.sql-row input[type=checkbox]:checked::after{
  content:'';position:absolute;left:4px;top:1px;
  width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.sql-row .sql-name{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sql-row.is-on .sql-name{color:var(--accent-text);font-weight:500}

/* Step bar inside drawer */
.step-bar{display:flex;gap:5px;margin-bottom:10px}
.step-seg{flex:1;height:3px;border-radius:99px;background:var(--border);transition:background .18s}
.step-seg.done{background:var(--accent)}
.step-label{font-size:11px;color:var(--faint);margin-bottom:14px;font-weight:500}

/* Section title */
.section-title{font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}

/* Settings toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-weight:500;font-size:13.5px}
.toggle-desc{font-size:12px;color:var(--faint);margin-top:2px}
.toggle{width:36px;height:20px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;transition:background .18s;flex-shrink:0;border:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle.on::after{transform:translateX(16px)}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:11px 16px;border:1px solid var(--border);border-left:3px solid var(--green);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-lg);max-width:340px;font-weight:500;font-size:13px;animation:toastIn .22s ease;pointer-events:all}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* Row actions */
.row-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:nowrap}

/* Recovery list */
.recover-list{list-style:none;padding:0;margin:0 0 14px}
.recover-list li{padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;background:var(--surface-2);font-size:12.5px;line-height:1.5}

/* Skeleton */
.skel{border-radius:8px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--hover) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.skel-row{display:flex;gap:12px;margin-bottom:12px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" style="border-radius: 8px; flex-shrink: 0;">
          <defs>
            <linearGradient id="ant-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="50%" stop-color="#d97706"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="22" fill="url(#ant-bg)"/>
          <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 44 32 Q 36 20 28 22"/>
            <path d="M 56 32 Q 64 20 72 22"/>
            <path d="M 44 48 Q 28 42 22 52"/>
            <path d="M 56 48 Q 72 42 78 52"/>
            <path d="M 44 54 Q 26 56 20 68"/>
            <path d="M 56 54 Q 74 56 80 68"/>
            <path d="M 44 60 Q 30 72 26 82"/>
            <path d="M 56 60 Q 70 72 74 82"/>
          </g>
          <g fill="#ffffff">
            <circle cx="50" cy="34" r="8"/>
            <ellipse cx="50" cy="52" rx="6" ry="9"/>
            <ellipse cx="50" cy="73" rx="11" ry="14"/>
          </g>
        </svg>
        Chumoli
      </div>
    <div class="nav-section">
      <div class="nav-label">Asosiy</div>
      <button class="nav-item active" data-page="pipelines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        Pipeline'lar
      </button>
      <button class="nav-item" data-page="connectors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 7V2"/><path d="M15 7V2"/><path d="M6 13V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5a6 6 0 0 1-12 0z"/></svg>
        Ulagichlar
      </button>
      <button class="nav-item" data-page="runs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Ishga tushirishlar
      </button>
      <div class="nav-label" style="margin-top:8px">Tizim</div>
      <button class="nav-item" data-page="settings">

  uzum_market: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>`,

function connectorIcon(key){ return CONNECTOR_ICONS[key] || `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 7V2"/><path d="M15 7V2"/><path d="M6 13V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5a6 6 0 0 1-12 0z"/></svg>`; }

let connectors = [], destinations = [], savedDestinations = [], pipelines = [], runs = [], runStats = {};
let scheduler = {}, telegramCfg = {configured:false};
let page = 'pipelines', selectedConnector = null, step = 1, draft = {}, editingName = null;
let testState = 'idle', inspectedTables = [], inspectedDbLabel = '', inspectedColumns = {}, pollTimers = {}, recoverPipeline = null, activeRuns = {};

function isSqlConnector(k){ return ['sql_database','postgresql','mysql'].includes(k); }

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function connectorLabel(key){ const m = connectors.find(x=>x.key===key); return m?m.label:key; }

function sortedConnectors(){
  const byKey = Object.fromEntries(connectors.map(c=>[c.key,c]));
  const ordered = [];
  for(const k of CONNECTOR_ORDER) if(byKey[k]) ordered.push(byKey[k]);
  for(const c of connectors) if(!CONNECTOR_ORDER.includes(c.key)) ordered.push(c);
  return ordered;
}

function fmtTime(iso){
  if(!iso) return '—';
  try{ const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch{ return iso; }
}
function fmtRelative(iso){
  if(!iso) return '—';
  try{
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff/60000);
    if(m < 1) return 'Hozir';
    if(m < 60) return m+'daq oldin';
    const h = Math.floor(m/60);
    if(h < 24) return h+'soat oldin';
    return Math.floor(h/24)+'kun oldin';
  }catch{ return iso; }
}
function fmtDur(s){
  if(s==null||s==='') return '—';
  const n=Number(s);
  if(n<1) return (n*1000).toFixed(0)+'ms';
  if(n<60) return n.toFixed(1)+'s';
  return Math.floor(n/60)+'m '+ Math.round(n%60)+'s';
}
function fmtMem(mb){
  if(!mb||mb<=0) return null;
  if(mb>=1024) return (mb/1024).toFixed(1)+' GB';
  return mb.toFixed(0)+' MB';
}
function fmtRows(n){
  if(n==null) return '—';
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return String(n);
}

function lastRunBadge(lr){
  if(!lr) return '<span class="badge dim"><span class="dot"></span>Hech qachon</span>';
  if(!lr.success) return '<span class="badge err"><span class="dot"></span>Load xato</span>';
  if(lr.quality_passed) return '<span class="badge ok"><span class="dot"></span>OK</span>';
  const fails=(lr.quality_details||[]).filter(d=>d&&d.passed===false);
  const title=esc(fails[0]?.detail||'Quality tekshiruvi otmadi');
  return `<span class="badge warn" title="${title}"><span class="dot"></span>Quality ⚠ (${fails.length||'?'})</span>`;
}

function qualityFailDetails(r){
  if(!Array.isArray(r.quality_details)) return '';
  const fails=r.quality_details.filter(d=>d&&d.passed===false);
  if(!fails.length) return '';
  const lines=fails.slice(0,2).map(f=>{
    const txt=String(f.detail||'');
    return `<div style="font-size:11px;color:var(--amber);margin-top:2px">⚠ ${esc(txt.length>80?txt.slice(0,80)+'…':txt)}</div>`;
  });
  if(fails.length>2){
    lines.push(`<div style="font-size:11px;color:var(--faint)">+${fails.length-2} ta boshqa xatolik</div>`);
  }
  return lines.join('');
}

function lastRunSummary(lr){
  /* Holat ustuni: faqat status badge (+ tezlik).
     Qatorlar / Vaqt alohida ustunlarda — takrorlamaymiz. */
  if(!lr) return '<span class="badge dim">Hech qachon</span>';
  const badge=lastRunBadge(lr);
  if(!lr.success) return badge;
  let speed='';
  if(lr.rows_per_second>0){
    speed=`<div class="metric-speed" style="font-size:11px;margin-top:2px">${Math.round(lr.rows_per_second).toLocaleString()} q/s</div>`;
  }
  let ram='';
  if(lr.peak_memory_mb>0){
    const mem=fmtMem(lr.peak_memory_mb);
    if(mem) ram=`<div class="metric-ram" style="margin-top:2px">${mem} RAM</div>`;
  }
  return badge+speed+ram;
}

function rowsNewTotal(r){
  if(!r) return '—';
  if(r.new_rows&&!r.is_first_run&&r.new_rows<r.total_rows){
    return `<span style="color:var(--green)">+${fmtRows(r.new_rows)}</span> / ${fmtRows(r.total_rows)}`;
  }
  return fmtRows(r.total_rows);
}

// Mini sparkline from last 10 runs for a pipeline
function sparkline(pipelineName){
  const pRuns = runs.filter(r=>r.pipeline_name===pipelineName).slice(0,10).reverse();
  if(pRuns.length < 2) return '';
  const maxRows = Math.max(...pRuns.map(r=>r.total_rows||0), 1);
  const bars = pRuns.map(r=>{
    const h = Math.max(4, Math.round(((r.total_rows||0)/maxRows)*20));
    const color = r.success&&r.quality_passed ? 'var(--green)' : r.success ? 'var(--amber)' : 'var(--red)';
    return `<div class="spark-bar" style="height:${h}px;background:${color}"></div>`;
  }).join('');
  return `<div class="spark-row">${bars}</div>`;
}

async function api(path,opts={}){
  const {headers:extra,...rest}=opts;
  const headers={'Content-Type':'application/json',...(extra||{})};
  const meta=document.querySelector('meta[name="chumoli-api-key"]');
  const key=meta&&meta.getAttribute('content');
  if(key) headers['X-API-Key']=key;
  const r=await fetch(API+path,{...rest,headers});
  const text=await r.text();
  let data=null;
  try{ data=text?JSON.parse(text):null; }catch{ data=text; }
  if(!r.ok){
    const msg=(data&&(data.detail||data.validation_errors||data.message))||text||r.statusText;
    const err=new Error(typeof msg==='string'?msg:JSON.stringify(msg));
    err.status=r.status;
    err.data=data;
    throw err;
  }
  return data;
}

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(),4000);
}

function openDrawer(){ document.getElementById('overlay').classList.add('show'); document.getElementById('drawer').classList.add('open'); }
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('open');
  step=1; selectedConnector=null; editingName=null; draft={}; testState='idle';
  inspectedTables=[]; inspectedDbLabel=''; inspectedColumns={}; syncSteps();
}
document.getElementById('drawer-close').onclick=closeDrawer;
document.getElementById('overlay').onclick=closeDrawer;

function syncSteps(){ document.querySelectorAll('.dstep').forEach(s=>s.classList.toggle('on',Number(s.dataset.s)<=step)); }

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); page=btn.dataset.page;
    document.getElementById('top-title').textContent=PAGE_TITLES[page]||page;
    render();
  };
});

async function loadAll(){
  try{
    const h=await api('/api/health');
    const pill=document.getElementById('health-pill');
    const dot=document.getElementById('foot-dot');
    const footText=document.getElementById('foot-text');
    document.getElementById('health-text').textContent=h.status==='ok'?'API ishlayapti':h.status;
    const ok=h.status==='ok';
    pill.classList.toggle('off',!ok);
    dot.classList.toggle('off',!ok);
    footText.textContent=ok?'dlt engine · local':'Offline';
    if(h.scheduler_running!=null) scheduler={running:h.scheduler_running,job_count:h.scheduler_jobs};
  }catch{
    document.getElementById('health-text').textContent='API offline';
    document.getElementById('health-pill').classList.add('off');
    document.getElementById('foot-dot').classList.add('off');
    document.getElementById('foot-text').textContent='Offline';
  }

  const results=await Promise.allSettled([
    api('/api/connectors'),
    api('/api/pipelines'),
    api('/api/destinations').catch(()=>[]),
    api('/api/destinations/saved').catch(()=>[]),
    api('/api/runs?limit=50').catch(()=>[]),
  ]);
  const [cR,pR,dR,sdR,rR]=results;

  if(cR.status==='rejected'){
    const e=cR.reason;
    if(e&&e.status===401) toast("API key noto'g'ri yoki yo'q. Sahifani yangilang.",'err');
    else toast('Ulagichlar yuklanmadi: '+(e&&e.message?e.message:e),'err');
  }else{ connectors=cR.value; }

  if(pR.status==='rejected'){
    toast("Pipeline'lar yuklanmadi: "+(pR.reason&&pR.reason.message?pR.reason.message:pR.reason),'err');
  }else{ pipelines=pR.value; }

  destinations=dR.status==='fulfilled'?dR.value:[];
  savedDestinations=sdR.status==='fulfilled'?sdR.value:[];
  runs=rR.status==='fulfilled'?rR.value:[];

  render();
}

async function loadRuns(){
  try{
    runs=await api('/api/runs?limit=50');
    runStats=await api('/api/runs/stats');
  }catch(e){ toast('Runs yuklanmadi: '+e.message,'err'); }
}

async function loadSettings(){
  try{ scheduler=await api('/api/scheduler'); }catch{}
  try{ telegramCfg=await api('/api/settings/telegram'); }catch{ telegramCfg={configured:false}; }
}

function render(){
  if(page==='connectors') return renderConnectors();
  if(page==='runs') return renderRuns();
  if(page==='settings') return renderSettings();
  renderPipelines();
}

async function previewPipeline(name){
  try{
    const res=await api('/api/pipelines/'+encodeURIComponent(name)+'/preview?limit=10');
    const tables=res.tables||{};
    const names=Object.keys(tables);
    const files=res.files||[];
    const exportPath=res.export_path||null;
    const kind=res.kind||null;

    // Filesystem/S3: show path even when no table sample yet
    if(res.error&&!names.length&&!exportPath&&!files.length){
      toast(res.error,'err'); return;
    }
    if(!names.length&&!exportPath&&!files.length){
      toast("Ko'rsatish uchun ma'lumot yo'q",'err'); return;
    }

    const pipe=pipelines.find(p=>p.name===name);
    const lr=pipe&&pipe.last_run;
    const colCounts=res.col_counts||(lr&&lr.col_counts)||{};
    const rowCounts=(lr&&lr.row_counts)||{};

    document.getElementById('drawer-title').textContent=name+' — Preview';
    const body=document.getElementById('drawer-body');
    const foot=document.getElementById('drawer-foot');
    let html='';

    // Local filesystem / S3: export path + one-click copy
    if(exportPath){
      const label=kind==='s3'?'Bucket URL':'Eksport papkasi';
      html+=`<div style="margin-bottom:16px;padding:12px 14px;background:var(--surface2,#1a1a1a);border-radius:8px;border:1px solid var(--border,#333)">
        <div class="section-title" style="margin-bottom:6px">${label}</div>
        <div class="mono" style="font-size:13px;word-break:break-all;margin-bottom:10px" id="export-path-text">${esc(exportPath)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" type="button" id="btn-copy-export">📋 Nusxa olish</button>
          ${kind==='filesystem'?`<a class="btn btn-ghost btn-sm" href="file://${esc(exportPath)}" title="Ba'zi brauzerlar file:// ni bloklaydi">📂 Papkani ochish</a>`:''}
        </div>
        <div style="font-size:11px;color:var(--faint);margin-top:8px">_dlt* metadata yashirin (pipelines); bu yerda faqat ma'lumot fayllari.</div>
      </div>`;
    }

    if(files.length){
      html+=`<div style="margin-bottom:18px">
        <div class="section-title">Fayllar (${files.length})</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Fayl</th><th>Hajm</th></tr></thead>
            <tbody>${files.slice(0,40).map(f=>`<tr>
              <td class="mono" style="font-size:12px">${esc(f.relative||f.name||f.path)}</td>
              <td class="mono">${f.size!=null?(f.size<1024?f.size+' B':(f.size/1024).toFixed(1)+' KB'):'—'}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`;
    }

    if(res.error&&names.length){
      html+=`<div class="field-err" style="margin-bottom:12px">${esc(res.error)}</div>`;
    }

    const schemaNames=[...new Set([...Object.keys(colCounts),...Object.keys(rowCounts),...names])];
    if(schemaNames.length&&!kind){
      html+=`<div style="margin-bottom:18px">
        <div class="section-title">Schema</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Jadval</th><th>Qatorlar</th><th>Ustunlar</th></tr></thead>
            <tbody>${schemaNames.map(t=>`<tr>
              <td><strong>${esc(t)}</strong></td>
              <td class="mono">${fmtRows(rowCounts[t])}</td>
              <td class="mono">${colCounts[t]!=null?colCounts[t]:'—'}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
        ${lr&&lr.cursor_last_value!=null?`<div style="font-size:12px;color:var(--faint);margin-top:8px">Cursor: ${esc(String(lr.cursor_last_value))}</div>`:''}
      </div>`;
    }
    for(const tbl of names){
      const info=tables[tbl];
      if(info.error){
        html+=`<div style="margin-bottom:16px">
          <div class="section-title">${esc(tbl)}</div>
          <div class="field-err">${esc(info.error)}</div>
        </div>`;
        continue;
      }
      const cols=info.columns||[];
      const rows=info.rows||[];
      const fileHint=info.file?` · ${info.file}`:'';
      html+=`<div style="margin-bottom:20px">
        <div class="section-title">${esc(tbl)} — ${rows.length} qator${esc(fileHint)}</div>
        <div class="table-wrap" style="overflow-x:auto;max-height:280px">
          <table>
            <thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>
              ${rows.map(r=>`<tr>${r.map(v=>
                `<td class="mono" style="font-size:12px;white-space:nowrap">${esc(v==null?'NULL':String(v))}</td>`
              ).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }
    body.innerHTML=html;
    foot.innerHTML=`<button class="btn btn-ghost" onclick="closeDrawer()">Yopish</button>`;
    const copyBtn=document.getElementById('btn-copy-export');
    if(copyBtn&&exportPath){
      copyBtn.onclick=async()=>{
        try{
          await navigator.clipboard.writeText(exportPath);
          toast('Yo\'l nusxalandi','ok');
        }catch(_){
          toast(exportPath,'ok');
        }
      };
    }
    openDrawer();
  }catch(e){ toast(e.message,'err'); }
}

const STEP_LABELS={starting:'Boshlanmoqda',extract:"Ma'lumot olish",run:'Yuklash',count:'Hisoblash',quality:'Quality',done:'Tayyor',failed:'Xato'};

async function runPipeline(name,btn){
  btn.disabled=true; btn.textContent='…';
  try{
    const job=await api('/api/pipelines/'+encodeURIComponent(name)+'/run/async',{method:'POST'});
    const runId=job.run_id||job.id;
    if(!runId){
      const r=await api('/api/pipelines/'+encodeURIComponent(name)+'/run',{method:'POST'});
      showRunResult(name,r); pipelines=await api('/api/pipelines'); if(page==='pipelines') renderPipelines();
      btn.disabled=false; btn.textContent='▶ Run'; return;
    }
    toast(name+' ishga tushdi…');
    pollRun(runId,name,btn);
  }catch(e){
    // 409 = already running — do NOT fall back to sync (that caused LoadPackageNotFound)
    if(e.status===409){
      toast(e.message||'Pipeline allaqachon ishlayapti','err');
      btn.disabled=false; btn.textContent='▶ Run';
      return;
    }
    // Async endpoint missing → sync once
    try{
      const r=await api('/api/pipelines/'+encodeURIComponent(name)+'/run',{method:'POST'});
      showRunResult(name,r); pipelines=await api('/api/pipelines'); if(page==='pipelines') renderPipelines();
    }catch(e2){
      toast(e2.message,'err');
    }
    btn.disabled=false; btn.textContent='▶ Run';
  }
}

function runBtn(name, fallback){
  return document.querySelector('[data-run="'+CSS.escape(name)+'"]') || fallback || null;
}

function setRunBtn(name, text, disabled, fallback){
  const b=runBtn(name, fallback);
  if(!b) return;
  b.disabled=!!disabled;
  b.textContent=text;
}

function pollRun(runId,name,btn){
  if(pollTimers[runId]) clearInterval(pollTimers[runId]);
  activeRuns[name]={runId};
  let n=0;
  // ~15 min @ 1s — katta dataset / REST pagination uchun (backend async)
  const maxPolls=900;
  const intervalMs=1000;
  pollTimers[runId]=setInterval(async()=>{
    n++;
    try{
      const job=await api('/api/runs/jobs/'+encodeURIComponent(runId));
      if(job.status==='running'||job.status==='queued'||job.status==='pending'){
        const step=job.step||job.status;
        const label=STEP_LABELS[step]||step;
        const el=job.elapsed_seconds!=null?Math.round(job.elapsed_seconds)+'s':'';
        setRunBtn(name, label+(el?' · '+el:''), true, btn);
        if(n>maxPolls){
          clearInterval(pollTimers[runId]);
          delete activeRuns[name];
          setRunBtn(name, '▶ Run', false, btn);
          toast(name+' hali ishlayapti — keyinroq yangilang (timeout emas, backend davom etishi mumkin)','err');
        }
        return;
      }
      clearInterval(pollTimers[runId]);
      delete activeRuns[name];
      if(job.status==='error'){
        toast('Xato: '+name+(job.error?' — '+job.error:''),'err');
      }else{
        showRunResult(name,job.result||job);
      }
      pipelines=await api('/api/pipelines'); runs=await api('/api/runs?limit=50').catch(()=>runs);
      if(page==='pipelines') renderPipelines();
      setRunBtn(name, '▶ Run', false, btn);
    }catch(e){
      if(e.status===404){
        clearInterval(pollTimers[runId]);
        delete activeRuns[name];
        setRunBtn(name, '▶ Run', false, btn);
        toast("Server qayta ishga tushdi — Runs bo'limidan tekshiring",'err');
        return;
      }
      if(n>8){
        clearInterval(pollTimers[runId]);
        delete activeRuns[name];
        setRunBtn(name, '▶ Run', false, btn);
        toast(e.message,'err');
      }
    }
  },intervalMs);
}

/** Sahifa almashtirilganda / re-render da ishlayotgan pipeline tugmalarini tiklash */
async function applyRunningUI(){
  // Client-side active polls
  Object.keys(activeRuns).forEach(name=>{
    setRunBtn(name, 'Ishlayapti…', true);
  });
  // Server-side running (pollTimers yo'qolgan bo'lsa ham)
  try{
    const r=await api('/api/pipelines/running');
    const running=r.running||{};
    Object.keys(running).forEach(name=>{
      const info=running[name]||{};
      const step=info.step||'run';
      const label=STEP_LABELS[step]||step;
      const el=info.elapsed_seconds!=null?Math.round(info.elapsed_seconds)+'s':'';
      setRunBtn(name, label+(el?' · '+el:''), true);
      // Agar client poll yo'q bo'lsa — status orqali soft poll
      const hasClientPoll=activeRuns[name]&&pollTimers[activeRuns[name].runId];
      if(!hasClientPoll && !pollTimers['status:'+name]){
        pollPipelineStatus(name);
      }
    });
  }catch(_){ /* ignore */ }
}

function pollPipelineStatus(name){
  const key='status:'+name;
  if(pollTimers[key]) clearInterval(pollTimers[key]);
  let n=0;
  pollTimers[key]=setInterval(async()=>{
    n++;
    try{
      const st=await api('/api/pipelines/'+encodeURIComponent(name)+'/status');
      if(st.running){
        const step=st.step||'run';
        const label=STEP_LABELS[step]||step;
        const el=st.elapsed_seconds!=null?Math.round(st.elapsed_seconds)+'s':'';
        setRunBtn(name, label+(el?' · '+el:''), true);
        if(n>900){ clearInterval(pollTimers[key]); delete pollTimers[key]; setRunBtn(name,'▶ Run',false); }
        return;
      }
      clearInterval(pollTimers[key]);
      delete pollTimers[key];
      setRunBtn(name, '▶ Run', false);
      pipelines=await api('/api/pipelines'); runs=await api('/api/runs?limit=50').catch(()=>runs);
      if(page==='pipelines') renderPipelines();
    }catch(e){
      if(n>8){ clearInterval(pollTimers[key]); delete pollTimers[key]; setRunBtn(name,'▶ Run',false); }
    }
  },1500);
}

function showRunResult(name,r){
  if(!r){ toast(name+" — natija yo'q",'err'); return; }
  const rows=Object.entries(r.row_counts||{}).map(([t,n])=>t+': '+n).join(', ')||(fmtRows(r.total_rows)+' qator');
  if(r.success&&r.quality_passed){
    const speedInfo=r.rows_per_second>0?` · ${Math.round(r.rows_per_second).toLocaleString()} q/s`:'';
    const memStr=r.peak_memory_mb>0?` · ${fmtMem(r.peak_memory_mb)} RAM`:'';
    const rowInfo=(!r.is_first_run&&r.new_rows<r.total_rows)
      ? `+${fmtRows(r.new_rows)} yangi (jami ${fmtRows(r.total_rows)})`
      : rows;
    toast(`✓ ${name} — ${rowInfo}${speedInfo}${memStr}`,'ok');
    if(r.schema_changes&&r.schema_changes.length>0){
      setTimeout(()=>{ toast('Schema yangilandi: '+r.schema_changes.join(', '),'ok'); },500);
    }
  }else if(r.success){
    toast('Yuklandi, quality ogohlantirish: '+name,'err');
  }else{
    toast('Xato: '+name+(r.error?' — '+r.error:''),'err');
  }
}

async function delPipeline(name){
  if(!confirm(name+" pipeline o'chirilsinmi?")) return;
  try{
    await api('/api/pipelines/'+encodeURIComponent(name),{method:'DELETE'});
    toast("O'chirildi: "+name);
    pipelines=await api('/api/pipelines'); renderPipelines();
  }catch(e){ toast(e.message,'err'); }
}

async function startEdit(name){
  if(!telegramCfg.configured){ try{ telegramCfg=await api('/api/settings/telegram'); }catch{} }
  try{
    const p=await api('/api/pipelines/'+encodeURIComponent(name));
    const cfg=p.config||{};
    selectedConnector=p.connector_key; editingName=name; draft={};
    draft['f-name']=name;
    for(const [k,v] of Object.entries(cfg.source_params||{})){ draft['f-'+k]=v==null?'':String(v); }
    const dest=cfg.destination||{};
    draft['f-dest-mode']='new'; draft['f-dest']=dest.connector||'duckdb';
    draft['f-dataset']=dest.dataset_name||'raw';
    draft['f-file-format']=dest.file_format||'csv';
    draft['f-wd']=cfg.write_disposition||'replace';
    draft['f-pk']=(cfg.primary_key||[]).join(', ');
    if(cfg.source_params?.table_write) draft['f-table_write']=typeof cfg.source_params.table_write==='string'?cfg.source_params.table_write:JSON.stringify(cfg.source_params.table_write);
    const sch=cfg.schedule||{};
    draft['f-sched-kind']=sch.kind||'manual';
    draft['f-sched-min']=sch.interval_minutes!=null?String(sch.interval_minutes):'60';
    draft['f-sched-time']=sch.daily_at_time||'10:00';
    draft['f-sched-tz']=sch.timezone||'Asia/Tashkent';
    const q=cfg.quality||{};
    draft['f-q-min']=q.row_count_min!=null?String(q.row_count_min):'';
    draft['f-q-nn']=(q.not_null_columns||[]).join(', ');
    draft['f-q-dup']=q.no_duplicates_key||'';
    draft['f-q-table']=q.table_name||'';
    const notif=cfg.notify||{};
    draft['f-tg-chat']=notif.telegram_chat_id||'';
    draft['f-n-fail']=notif.on_failure!==false;
    draft['f-n-ok']=!!notif.on_success;
    testState=isSqlConnector(selectedConnector)&&(cfg.source_params?.table_names||'').trim()?'ok':'idle';
    inspectedTables=[]; inspectedDbLabel=""; inspectedColumns={}; step=2;
    document.getElementById('drawer-title').textContent='Tahrirlash: '+name;
    renderDrawer(); openDrawer();
  }catch(e){ toast(e.message,'err'); }
}

function captureDraft(){
  document.querySelectorAll('#drawer-body [id^="f-"]').forEach(el=>{
    if(el.type==='checkbox') draft[el.id]=el.checked;
    else if(el.type==='password'){ if(el.value) draft[el.id]=el.value; }
    else if(el.type==='hidden'){
      // Never let a stale hidden input wipe draft (table_names managed by picker)
      if(el.id==='f-table_names'||el.id==='f-table_cursors'){
        if(el.value) draft[el.id]=el.value;
      } else {
        draft[el.id]=el.value;
      }
    }
    else if(el.readOnly || el.disabled){
      if(el.value) draft[el.id]=el.value;
    }
    else draft[el.id]=el.value;
  });
  // SQL table picker: live checkbox + per-table cursor state is source of truth
  const box=document.getElementById('sql-tables');
  if(box){
    const cbs=[...box.querySelectorAll('.sql-tbl')];
    if(cbs.length){
      const sel=cbs.filter(c=>c.checked).map(c=>c.value);
      draft['f-table_names']=sel.join(', ');
      const cursors={};
      sel.forEach(t=>{
        const {column, initial, kind}=getCursorInputs(t);
        if(column||initial) cursors[t]={column, initial, kind};
      });
      draft['f-table_cursors']=Object.keys(cursors).length?JSON.stringify(cursors):'';
    }
  }
}

function dv(id,fallback){
  if(draft[id]!==undefined&&draft[id]!==null) return draft[id];
  return fallback;
}

function stepBarHtml(n,total){
  const segs=Array.from({length:total},(_,i)=>`<div class="step-seg ${i+1<=n?'done':''}"></div>`).join('');
  return `<div class="step-bar">${segs}</div><div class="step-label">Qadam ${n} / ${total}</div>`;
}

function renderDrawer(){
  captureDraft(); syncSteps();
  const body=document.getElementById('drawer-body');
  const foot=document.getElementById('drawer-foot');
  if(step===1) return renderStepConnector(body,foot);
  if(step===2) return renderStepConnection(body,foot);
  if(step===3) return renderStepTables(body,foot);
  return renderStepDestAndSave(body,foot);
}

function renderStepConnector(body,foot){
  const list=sortedConnectors();
  const cats=[
    ...CATEGORY_ORDER.filter(k=>list.some(x=>x.category===k)),
    ...[...new Set(list.map(x=>x.category))].filter(k=>!CATEGORY_ORDER.includes(k)),
  ];
  body.innerHTML=stepBarHtml(1,4)+`<div class="field-hint" style="margin-bottom:12px">Qaysi manbaga ulanamiz?</div>`+cats.map(cat=>`
    <div style="margin-bottom:16px">
      <div class="section-title">${esc(CATEGORY_LABELS[cat]||cat)}</div>
      <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
        ${list.filter(x=>x.category===cat).map(x=>`
          <button class="card card-conn ${selectedConnector===x.key?'selected':''}" data-ck="${esc(x.key)}">
            <div class="card-icon card-icon-plug">${connectorIcon(x.key)}</div>
            <div class="card-title">${esc(x.label)}${maturityBadge(x)}</div>
            <div class="card-desc" style="font-size:11.5px">${esc(x.description||'')}</div>
          </button>`).join('')}
      </div>
    </div>`).join('');
  body.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{
    if(selectedConnector!==b.dataset.ck){ draft={}; testState='idle'; inspectedTables=[]; inspectedDbLabel=""; inspectedColumns={}; }
    selectedConnector=b.dataset.ck; editingName=null; renderDrawer();
  });
  foot.innerHTML=`<button class="btn btn-primary" id="next1" ${selectedConnector?'':'disabled'}>Keyingi →</button>`;
  document.getElementById('next1')?.addEventListener('click',()=>{ step=2; renderDrawer(); });
}

const AUTH_FIELDS=new Set(['auth_type','auth_key_name','auth_location','max_pages']);

function renderStepConnection(body,foot){
  const m=connectors.find(x=>x.key===selectedConnector);
  const isSql=isSqlConnector(selectedConnector);
  const isRest=selectedConnector==='rest_api';
  // endpoint ni ham step2 ga qo'shamiz (REST uchun)
  const connFields=(m?.fields||[]).filter(f=>
    f.secret||f.key==='connection_string'||f.key==='base_url'||f.key==='endpoint'||AUTH_FIELDS.has(f.key)
  );
  const fieldsToShow=connFields.length?connFields:(m?.fields||[]).filter(f=>!['table_names','cursor_column','cursor_initial_value','table_cursors','resources'].includes(f.key));
  let statusHtml='';
  if(isSql){
    if(testState==='ok') statusHtml=`<div class="field-ok">✓ Ulanish tasdiqlandi${inspectedTables.length?' — '+inspectedTables.length+' jadval':''}</div>`;
    else if(testState==='fail') statusHtml=`<div class="field-err">Ulanish muvaffaqiyatsiz — qayta urinib ko'ring</div>`;
    else statusHtml=`<div class="field-hint" style="margin-top:6px">Keyingi bosilganda ulanish avtomatik tekshiriladi</div>`;
  }
  body.innerHTML=stepBarHtml(2,4)+`
    <div class="field">
      <label>Pipeline nomi</label>
      <input id="f-name" placeholder="masalan postgres_orders" value="${esc(editingName||dv('f-name',''))}" ${editingName?'readonly':''}/>
      <div class="field-hint">${editingName?"Nom o'zgartirilmaydi":'Faqat harf, raqam, _ va -'}</div>
    </div>
    ${fieldsToShow.map(f=>fieldHtml(f)).join('')}
    ${isSql?`<button type="button" class="btn btn-outline" id="btn-inspect" style="width:100%;margin-top:4px">Ulanishni tekshirish</button>${statusHtml}`:''}`;
  foot.innerHTML=`<button class="btn btn-ghost" id="back2">← Orqaga</button><button class="btn btn-primary" id="next2">Keyingi →</button>`;
  document.getElementById('back2').onclick=()=>{ captureDraft(); step=1; renderDrawer(); };
  document.getElementById('next2').onclick=async ()=>{
    const nameEl=document.getElementById('f-name');
    const name=((nameEl&&nameEl.value)||draft['f-name']||editingName||'').toString().trim();
    if(!name){ toast('Pipeline nomi majburiy','err'); return; }
    draft['f-name']=name;
    // REST: endpoint validation
    if(isRest){
      const epEl=document.getElementById('f-endpoint');
      const ep=((epEl&&epEl.value)||draft['f-endpoint']||'').trim();
      if(!ep){
        toast("Endpoint majburiy — masalan /posts yoki /api/v1/orders",'err');
        epEl?.focus();
        return;
      }
    }
    const connEl=document.getElementById('f-connection_string');
    if(connEl&&connEl.value) draft['f-connection_string']=connEl.value;
    if(isSql){
      const conn=(connEl&&connEl.value.trim())||(draft['f-connection_string']||'');
      if(!conn){ toast('Connection string kiriting','err'); return; }
      if(testState!=='ok'){
        const n2=document.getElementById('next2');
        if(n2){ n2.disabled=true; n2.textContent='Tekshirilmoqda…'; }
        try{
          await runSqlInspect();
          if(testState!=='ok'){
            if(n2){ n2.disabled=false; n2.textContent='Keyingi →'; }
            return;
          }
        }catch(e){
          if(n2){ n2.disabled=false; n2.textContent='Keyingi →'; }
          return;
        }
      }
    }
    step=3; renderDrawer();
  };
  document.getElementById('btn-inspect')?.addEventListener('click',runSqlInspect);
  document.getElementById('f-connection_string')?.addEventListener('input',()=>{
    const el=document.getElementById('f-connection_string');
    if(testState==='ok'&&el&&el.value&&el.value!==(draft['f-connection_string']||'')){
      testState='idle'; inspectedTables=[]; inspectedDbLabel=""; inspectedColumns={};
      const ok=document.querySelector('.field-ok');
      if(ok) ok.remove();
    }
  });
  // REST API: auth_type o'zgarganda keraksiz field'larni yashirish
  if(isRest){
    function syncAuthVisibility(){
      const authType=document.getElementById('f-auth_type')?.value||'none';
      const showKey=authType==='api_key';
      const showSecret=authType!=='none';
      const keyWrap=document.getElementById('f-auth_key_name')?.closest('.field');
      if(keyWrap) keyWrap.style.display=showKey?'':'none';
      const locWrap=document.getElementById('f-auth_location')?.closest('.field');
      if(locWrap) locWrap.style.display=showKey?'':'none';
      const secretWrap=document.getElementById('f-secret_value')?.closest('.field');
      if(secretWrap) secretWrap.style.display=showSecret?'':'none';
    }
    document.getElementById('f-auth_type')?.addEventListener('change',syncAuthVisibility);
    syncAuthVisibility();
  }
}


function getCursorInputs(table){
  const colEl=[...document.querySelectorAll('.sql-cursor-col')].find(el=>el.getAttribute('data-table')===table);
  const dateEl=[...document.querySelectorAll('.sql-cursor-init')].find(el=>el.getAttribute('data-table')===table);
  const numEl=[...document.querySelectorAll('.sql-cursor-init-num')].find(el=>el.getAttribute('data-table')===table);
  const column=(colEl&&colEl.value||'').trim();
  let kind='date';
  if(colEl){
    const opt=colEl.selectedOptions&&colEl.selectedOptions[0];
    if(opt&&opt.dataset.kind) kind=opt.dataset.kind;
    else {
      const meta=(inspectedColumns[table]||[]).find(c=>c.name===column);
      if(meta) kind=meta.kind;
    }
  }
  let initial='';
  if(kind==='number'){
    initial=(numEl&&numEl.value||'').trim();
  } else {
    initial=(dateEl&&dateEl.value||'').trim();
  }
  return {column, initial, kind};
}

function syncCursorInputVisibility(table){
  const colEl=[...document.querySelectorAll('.sql-cursor-col')].find(el=>el.getAttribute('data-table')===table);
  const dateEl=[...document.querySelectorAll('.sql-cursor-init')].find(el=>el.getAttribute('data-table')===table);
  const numEl=[...document.querySelectorAll('.sql-cursor-init-num')].find(el=>el.getAttribute('data-table')===table);
  if(!colEl) return;
  const opt=colEl.selectedOptions&&colEl.selectedOptions[0];
  const kind=(opt&&opt.dataset.kind)||'date';
  if(dateEl) dateEl.style.display=(kind==='number')?'none':'';
  if(numEl) numEl.style.display=(kind==='number')?'':'none';
}

function parseTableCursorsDraft(){
  try{
    const raw=dv('f-table_cursors','');
    if(!raw) return {};
    if(typeof raw==='object') return raw;
    return JSON.parse(raw)||{};
  }catch{ return {}; }
}

          <input id="f-table_names_manual" type="text" placeholder="orders, customers" value="${esc(dv('f-table_names',''))}"/>
        </div>`}
        <div class="field-hint">${tables.length?'Har bir jadval uchun alohida cursor ustun va boshlang\'ich sana (ixtiyoriy). Bo\'sh = to\'liq yuklash.':'Vergul bilan ajrating'}</div>
      </div>`;
  }else{
    tablesBlock=fields.filter(f=>!['table_names','table_cursors','cursor_column','cursor_initial_value','endpoint'].includes(f.key)).map(f=>fieldHtml(f)).join('')||`<div style="color:var(--faint);font-size:13px;padding:8px 0">Bu ulagich uchun qo'shimcha sozlama kerak emas</div>`;
  }

  body.innerHTML=stepBarHtml(3,4)+tablesBlock;
  foot.innerHTML=`<button class="btn btn-ghost" id="back3">← Orqaga</button><button class="btn btn-primary" id="next3">Keyingi →</button>`;
  document.getElementById('back3').onclick=()=>{ captureDraft(); step=2; renderDrawer(); };
  document.getElementById('next3').onclick=()=>{
    if(isSql){
      const box=document.getElementById('sql-tables');
      let sel=box?[...box.querySelectorAll('.sql-tbl:checked')].map(x=>x.value):[];
      const manual=document.getElementById('f-table_names_manual');
      if(manual?.value.trim()) sel=manual.value.split(',').map(s=>s.trim()).filter(Boolean);
      if(!sel.length){ toast('Kamida bitta jadval tanlang','err'); return; }
      draft['f-table_names']=sel.join(', ');
      // Collect per-table cursors
      const cursors={};
      sel.forEach(t=>{
        const {column, initial, kind}=getCursorInputs(t);
        if(column||initial) cursors[t]={column, initial, kind};
      });
      draft['f-table_cursors']=Object.keys(cursors).length?JSON.stringify(cursors):'';
      // Clear global cursor fields — per-table is source of truth in UI
      draft['f-cursor_column']='';
      draft['f-cursor_initial_value']='';
    }
    // REST: strip query from endpoint; require auth_key_name for api_key
    if(selectedConnector==='rest_api'){
      const epEl=document.getElementById('f-endpoint');
      if(epEl&&epEl.value){
        const raw=epEl.value.trim();
        if(raw.includes('?')){
          epEl.value=raw.split('?')[0]||'/';
          draft['f-endpoint']=epEl.value;
          toast("Endpoint dan query olib tashlandi (pagination backendda max_pages bilan)","ok");
        }
      }
      const authType=(document.getElementById('f-auth_type')||{}).value||draft['f-auth_type']||'none';
      if(authType==='api_key'){
        const keyName=((document.getElementById('f-auth_key_name')||{}).value||draft['f-auth_key_name']||'').trim();
        if(!keyName){
          toast("API key uchun 'Header/parametr nomi' majburiy (masalan api_key yoki X-API-Key)",'err');
          return;
        }
      }
    }
    step=4; renderDrawer();
  };

  function syncSqlPicker(){
    const box=document.getElementById('sql-tables');
    if(!box) return;
    const cbs=[...box.querySelectorAll('.sql-tbl')];
    const sel=cbs.filter(c=>c.checked).map(c=>c.value);
    draft['f-table_names']=sel.join(', ');
    const countEl=document.getElementById('sql-count');
    if(countEl) countEl.textContent=sel.length+' / '+cbs.length+' tanlangan';
    cbs.forEach(cb=>{
      const wrap=cb.closest('.sql-row-wrap')||cb.closest('.sql-row');
      if(wrap) wrap.classList.toggle('is-on', cb.checked);
      const cursorRow=wrap&&wrap.querySelector('.sql-cursor-row');
      if(cursorRow) cursorRow.style.display=cb.checked?'flex':'none';
    });
    // Update cursors draft live
    const cursors={};
    sel.forEach(t=>{
      const {column, initial, kind}=getCursorInputs(t);
      if(column||initial) cursors[t]={column, initial, kind};
    });
    draft['f-table_cursors']=Object.keys(cursors).length?JSON.stringify(cursors):'';
  }
  document.getElementById('sql-tables')?.querySelectorAll('.sql-tbl').forEach(cb=>{
    cb.addEventListener('change', syncSqlPicker);
  });
  document.querySelectorAll('.sql-cursor-col').forEach(el=>{
    el.addEventListener('change', ()=>{
      syncCursorInputVisibility(el.getAttribute('data-table'));
      syncSqlPicker();
    });
  });
  document.querySelectorAll('.sql-cursor-init, .sql-cursor-init-num').forEach(el=>{
    el.addEventListener('input', syncSqlPicker);
  });
  document.getElementById('sql-all')?.addEventListener('click',()=>{
    document.querySelectorAll('#sql-tables .sql-tbl').forEach(c=>{ c.checked=true; });
    syncSqlPicker();
  });
  document.getElementById('sql-none')?.addEventListener('click',()=>{
    document.querySelectorAll('#sql-tables .sql-tbl').forEach(c=>{ c.checked=false; });
    syncSqlPicker();
  });
}

                  <label style="font-size:12px;color:var(--dim)">Kalit ustun (masalan id)</label>
                  <select class="tw-pk" data-table="${esc(t)}" style="width:100%;height:32px;border:1px solid var(--border);border-radius:8px;padding:0 8px;font-size:12px;background:var(--bg);margin-top:4px">

                  </select>
                  <input class="tw-pk-manual" data-table="${esc(t)}" type="text" placeholder="yoki qo'lda: id, code" value="${esc(pk && !pkOpts.includes(pk)?pk:'')}" style="width:100%;height:30px;margin-top:4px;border:1px solid var(--border);border-radius:6px;padding:0 8px;font-size:12px;background:var(--bg)"/>

        <input type="hidden" id="f-wd" value="${esc(wdVal)}"/>

        <select id="f-wd">
          <option value="replace" ${wdVal==='replace'?'selected':''}>Qayta yozish — eski o'rniga yangi</option>

          <option value="merge" ${wdVal==='merge'?'selected':''}>Yangilash — kalit bo'yicha</option>

    <div class="field" id="sched-daily-wrap" style="display:none">
      <label>Har kuni soat</label>
      <input id="f-sched-time" type="time" value="${esc(dv('f-sched-time','10:00'))}"/>
      <div class="field-hint">Toshkent vaqti (Asia/Tashkent). Bir vaqtda ko'p pipeline bo'lsa navbat bilan ishlaydi.</div>
    </div>

    <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px">
      <div class="section-title">Sifat tekshiruvi</div>
      <div class="field-hint" style="margin-bottom:12px">
        Pipeline har run'dan keyin quyidagilarni tekshiradi
      </div>
      <div class="field">
        <label>Minimum qator soni</label>
        <input id="f-q-min" type="number" min="0"
               placeholder="1 (default — bo'sh yuklama ushlaydi)"
               value="${esc(dv('f-q-min','1'))}"/>
        <div class="field-hint">
          Agar bu sondan kam qator kelsa — xato sifatida belgilanadi.
          Payme/Click uchun kamida 1 qo'ying.
        </div>
      </div>
      <div class="field">
        <label>Not null ustunlar</label>
        <input id="f-q-nn" placeholder="col1, col2" value="${esc(dv('f-q-nn',''))}"/>
      </div>
      <div class="field">
        <label>Takrorlash tekshiruvi (ustun)</label>
        <input id="f-q-dup" placeholder="id" value="${esc(dv('f-q-dup',''))}"/>
        <div class="field-hint" id="dup-hint" style="display:none;color:var(--amber)">
          ⚠ Append mode bilan birga ishlatsangiz har run fail bo'ladi — replace yoki merge tanlang
        </div>
      </div>
      <div class="field">
        <label>Telegram chat ID</label>
        <input id="f-tg-chat" placeholder="-100123…" value="${esc(dv('f-tg-chat',''))}"/>
        ${!telegramCfg.configured?`<div class="field-hint" style="color:var(--amber)">⚠ Bot token hali sozlanmagan. <a href="#" id="goto-tg" style="color:var(--accent)">Sozlamalarga o'tish</a></div>`:''}
      </div>
      <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--dim);cursor:pointer">
          <input type="checkbox" id="f-n-fail" ${dv('f-n-fail',true)?'checked':''} style="accent-color:var(--accent)"/> Xatoda xabar
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--dim);cursor:pointer">
          <input type="checkbox" id="f-n-ok" ${dv('f-n-ok',false)?'checked':''} style="accent-color:var(--accent)"/> Muvaffaqiyatda xabar
        </label>
